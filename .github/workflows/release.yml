name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate deck tokens
        run: node KiBoard-protocol/protocol/generate-tokens.mjs lib/ui/tokens.g.dart build/.tokens.g.css

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Restore upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64" || { echo "Missing ANDROID_UPLOAD_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kiboard-upload.jks"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build signed Play Store bundle
        env:
          KIBOARD_UPLOAD_STORE_FILE: ${{ runner.temp }}/kiboard-upload.jks
          KIBOARD_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KIBOARD_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KIBOARD_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: kiboard-${{ github.ref_name }}-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
